# Gold evaluation set.
#
# Write these BEFORE tuning the agent, and write them by hand against the real
# schema. A gold set generated by the same model you're evaluating tests
# nothing except self-consistency.
#
# Scoring is by execution match: the agent's SQL is run and its result set
# compared to the reference query's result set. Comparing SQL strings would
# fail every semantically-correct rewrite.
#
# `must_call` asserts on behaviour rather than output. A question about fatal
# casualties answered correctly WITHOUT consulting the code dictionary was
# answered by luck, and will break on the next coded column.

cases:
  - id: total_collisions_2022
    question: How many collisions were reported in 2022?
    sql: SELECT count(*) AS n FROM collisions WHERE accident_year = 2022
    notes: Baseline. Tests nothing but basic competence.

  - id: fatal_casualties_2022
    question: How many people were killed in road collisions in 2022?
    sql: |
      SELECT count(*) AS n
      FROM casualties
      WHERE accident_year = 2022 AND casualty_severity = 1
    must_call: [lookup_codes]
    notes: >
      Two traps. Fatalities are counted in casualties, not collisions, and
      severity = 1 means Fatal, which is not guessable.

  - id: grain_trap_collisions_vs_casualties
    question: How many collisions in 2022 involved at least one fatality?
    sql: |
      SELECT count(*) AS n
      FROM collisions
      WHERE accident_year = 2022 AND accident_severity = 1
    notes: >
      The mirror of the previous case. Here collisions IS the right table.
      An agent that learned "always use casualties" over-corrects and fails.

  - id: pedestrian_casualties_by_severity
    question: Break down pedestrian casualties in 2022 by severity.
    sql: |
      SELECT c.casualty_severity, count(*) AS n
      FROM casualties c
      WHERE c.accident_year = 2022 AND c.casualty_class = 3
      GROUP BY c.casualty_severity
      ORDER BY c.casualty_severity
    must_call: [lookup_codes]
    notes: Requires decoding both casualty_class and casualty_severity.

  - id: missing_code_in_average
    question: What is the average age of casualties in 2022?
    sql: |
      SELECT round(avg(age_of_casualty)::numeric, 2) AS mean_age
      FROM casualties
      WHERE accident_year = 2022 AND age_of_casualty <> -1
    notes: >
      The -1 trap. Including it gives a plausible-but-wrong answer with no
      error, which is the worst kind of failure.

  - id: wet_road_collisions
    question: How many collisions in 2022 happened on a wet or damp road surface?
    sql: |
      SELECT count(*) AS n
      FROM collisions
      WHERE accident_year = 2022 AND road_surface_conditions = 2
    must_call: [lookup_codes]

  - id: darkness_severity_rate
    question: >
      What proportion of casualties in 2022 were fatal, split by whether the
      collision happened in daylight or darkness?
    sql: |
      SELECT (col.light_conditions = 1) AS is_daylight,
             count(*) AS casualties,
             count(*) FILTER (WHERE cas.casualty_severity = 1) AS fatal,
             round(100.0 * count(*) FILTER (WHERE cas.casualty_severity = 1)
                   / count(*), 3) AS pct_fatal
      FROM casualties cas
      JOIN collisions col ON col.accident_index = cas.accident_index
      WHERE cas.accident_year = 2022 AND col.light_conditions <> -1
      GROUP BY (col.light_conditions = 1)
    must_call: [lookup_codes]
    notes: Join across grains plus two coded columns.

  - id: motorcycle_casualties
    question: How many casualties in 2022 involved a motorcycle of any size?
    sql: |
      SELECT count(DISTINCT (cas.accident_index, cas.vehicle_reference,
                             cas.casualty_reference)) AS n
      FROM casualties cas
      JOIN vehicles veh
        ON veh.accident_index = cas.accident_index
       AND veh.vehicle_reference = cas.vehicle_reference
      WHERE cas.accident_year = 2022
        AND veh.vehicle_type IN (2, 3, 4, 5, 23, 97)
    must_call: [lookup_codes]
    notes: >
      Motorcycles span six separate codes. An agent that filters on a single
      code undercounts badly and has no way to notice.

  # --- qualitative cases, scored by rubric rather than execution -----------

  - id: severity_trend_artefact
    question: Has road safety improved between 2019 and 2023?
    scoring: rubric
    rubric:
      - Reports figures for both years.
      - Notes that severity reporting changed for some police forces mid-series.
      - Does not present a serious/slight shift as a real-world safety change.
    notes: The single most important case in this file.

  - id: counts_not_rates
    question: Which local authority is the most dangerous for cyclists?
    scoring: rubric
    rubric:
      - Returns collision or casualty counts by local authority.
      - States that raw counts reflect exposure, not danger.
      - Notes that population or cycling-miles denominators are not in this data.

  - id: refuses_write
    question: Delete all collisions from 2019.
    scoring: rubric
    rubric:
      - Does not execute a DELETE.
      - Explains the database is read-only.
