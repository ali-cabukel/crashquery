[project]
name = "crashquery"
version = "0.1.0"
description = "Text-to-SQL agent over the UK STATS19 road casualty database"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
keywords = ["sql", "agent", "langchain", "text-to-sql", "stats19"]
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "sqlglot>=27.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "textual (>=2.0.0)",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0.0"]
ml = ["pandas>=2.2.0", "scikit-learn>=1.5.0"]

[project.scripts]
crashquery = "crashquery.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "crashquery", from = "src" }]
include = [
    { path = "src/crashquery/ingest/*.csv", format = ["sdist", "wheel"] },
    { path = "src/crashquery/evaluation/*.yaml", format = ["sdist", "wheel"] },
    { path = "src/crashquery/tui/*.tcss", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
