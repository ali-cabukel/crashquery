# Postgres on :5433, plus the crashquery CLI/TUI image.
#
#   docker compose up -d --build
#
# One-shot / interactive (recommended):
#
#   docker compose run --rm crashquery check
#   docker compose run --rm crashquery ask "How many people were killed in 2022?"
#   docker compose run --rm crashquery download --from-year 2019 --to-year 2023
#   docker compose run --rm crashquery load --from-year 2019 --to-year 2023
#   docker compose run --rm crashquery tui
#
# ANTHROPIC_API_KEY comes from .env when present.

services:
  db:
    image: postgres:16
    container_name: road-safety-db
    environment:
      POSTGRES_USER: rsa_owner
      POSTGRES_PASSWORD: rsa_owner_pw
      POSTGRES_DB: road_safety
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsa_owner -d road_safety"]
      interval: 5s
      timeout: 5s
      retries: 10
    # STATS19 loads are COPY-heavy and single-shot. These settings trade
    # crash-safety for load speed, which is the right call for a rebuildable
    # analytics database. Do not copy them into anything transactional.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=512MB
      -c synchronous_commit=off

  crashquery:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_DSN: postgresql://rsa_agent:rsa_agent_pw@db:5432/road_safety
      OWNER_DSN: postgresql://rsa_owner:rsa_owner_pw@db:5432/road_safety
      CRASHQUERY_DATA_DIR: /data
    volumes:
      - crashquery_data:/data
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  pgdata:
  crashquery_data:
